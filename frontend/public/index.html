<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0F766E" />
        <meta name="description" content="CalcyTub — All Your Calculators in One Place. Free online calculators for finance, math, physics, chemistry, health and everyday life." />
        <script>
          try {
            var t = localStorage.getItem('calcytub_theme');
            if (t !== 'light') document.documentElement.classList.add('dark');
            document.documentElement.style.background = t === 'light' ? '#F7F4EC' : '#0D1720';
          } catch (e) { document.documentElement.classList.add('dark'); }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>CalcyTub — All Your Calculators in One Place</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to use CalcyTub.</noscript>
        <div id="root"></div>
    </body>
</html>
